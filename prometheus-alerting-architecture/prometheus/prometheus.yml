global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "127.0.0.1:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "127.0.0.1:9100"

  - job_name: "process_exporter"
    static_configs:
      - targets:
          - "127.0.0.1:9256"
