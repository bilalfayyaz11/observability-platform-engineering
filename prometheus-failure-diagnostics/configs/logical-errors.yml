global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: duplicate-job
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: duplicate-job
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: invalid-timeout
    scrape_interval: 15s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - 127.0.0.1:9091
