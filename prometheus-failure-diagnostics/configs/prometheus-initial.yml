global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100

  # Deliberately broken: nothing will listen on port 8080.
  - job_name: broken-target
    static_configs:
      - targets:
          - 127.0.0.1:8080
    scrape_interval: 10s
    scrape_timeout: 5s

  # Deliberately broken: hostname does not resolve and path is invalid.
  - job_name: invalid-config
    metrics_path: /invalid/path
    static_configs:
      - targets:
          - invalid-hostname:9090
