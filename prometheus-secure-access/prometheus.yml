global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    scheme: https

    tls_config:
      ca_file: /etc/ssl/prometheus/prometheus.crt
      server_name: localhost

    static_configs:
      - targets:
          - localhost:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - localhost:9100
