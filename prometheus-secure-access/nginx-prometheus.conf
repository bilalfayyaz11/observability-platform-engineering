upstream prometheus_backend {
    server 127.0.0.1:9090;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;

    server_name localhost;

    ssl_certificate     /etc/ssl/prometheus/prometheus.crt;
    ssl_certificate_key /etc/ssl/prometheus/prometheus.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Admin endpoints
    location ~ ^/(api/v1/admin|api/v1/write) {
        auth_basic "Admin Access Required";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass https://prometheus_backend;

        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/prometheus/prometheus.crt;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-User-Role admin;
    }

    # Viewer query endpoints
    location ~ ^/(api/v1/query|api/v1/query_range|api/v1/series|graph|targets) {
        auth_basic "Viewer Access Required";
        auth_basic_user_file /etc/nginx/.htpasswd-viewer;

        proxy_pass https://prometheus_backend;

        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/prometheus/prometheus.crt;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-User-Role viewer;
    }

    # Read-only metrics and status endpoints
    location ~ ^/(metrics|api/v1/status) {
        auth_basic "ReadOnly Access Required";
        auth_basic_user_file /etc/nginx/.htpasswd-readonly;

        proxy_pass https://prometheus_backend;

        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/prometheus/prometheus.crt;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-User-Role readonly;
    }

    # Default web UI - admin only
    location / {
        auth_basic "Admin Access Required";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass https://prometheus_backend;

        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/prometheus/prometheus.crt;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-User-Role admin;
    }
}

server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}
