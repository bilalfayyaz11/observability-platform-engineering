apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb3
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8181
    isDefault: false
    editable: false

    jsonData:
      version: SQL
      dbName: grafana_metrics
      httpMode: POST
      insecureGrpc: true

    secureJsonData:
      token: ${INFLUXDB_TOKEN}
