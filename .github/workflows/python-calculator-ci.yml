name: Python Calculator CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "python-ci-quality-gates/**"
      - ".github/workflows/python-calculator-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "python-ci-quality-gates/**"
      - ".github/workflows/python-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: python-ci-quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-ci-quality-gates/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run code-quality checks
        run: |
          flake8 calculator.py test_calculator.py

      - name: Run tests with coverage
        run: |
          pytest test_calculator.py \
            -v \
            --cov=calculator \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: calculator-coverage-${{ github.run_id }}
          path: python-ci-quality-gates/coverage.xml
          if-no-files-found: error
          retention-days: 14
