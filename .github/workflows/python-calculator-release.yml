name: Python Calculator Quality Gates

on:
  push:
    branches:
      - main
    paths:
      - "python-ci-quality-gates/**"
      - ".github/workflows/python-calculator-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "python-ci-quality-gates/**"
      - ".github/workflows/python-calculator-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-calculator-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: python-ci-quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-ci-quality-gates/requirements.txt

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==7.3.0

      - name: Validate Python syntax
        run: |
          python -m py_compile calculator.py test_calculator.py

      - name: Run Flake8
        run: |
          flake8 calculator.py test_calculator.py

  test:
    name: Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    defaults:
      run:
        working-directory: python-ci-quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-ci-quality-gates/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest test_calculator.py \
            -v \
            --cov=calculator \
            --cov-branch \
            --cov-report=term-missing

  build:
    name: Build Release Artifact
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create distribution archive
        run: |
          tar \
            --exclude="__pycache__" \
            --exclude=".pytest_cache" \
            --exclude=".coverage" \
            --exclude="coverage.xml" \
            -czf calculator-automation.tar.gz \
            python-ci-quality-gates/calculator.py \
            python-ci-quality-gates/test_calculator.py \
            python-ci-quality-gates/requirements.txt \
            python-ci-quality-gates/pyproject.toml \
            python-ci-quality-gates/.flake8

      - name: Generate archive checksum
        run: |
          sha256sum calculator-automation.tar.gz \
            > calculator-automation.tar.gz.sha256

      - name: Inspect archive
        run: |
          tar -tzf calculator-automation.tar.gz
          cat calculator-automation.tar.gz.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-automation-${{ github.run_id }}
          path: |
            calculator-automation.tar.gz
            calculator-automation.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
