apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Kubernetes Observability
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: false
        updateIntervalSeconds: 30

        options:
          path: /var/lib/grafana/dashboards
