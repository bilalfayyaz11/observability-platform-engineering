apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: grafana

  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana

    spec:
      containers:

        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:

            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:

            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

            - name: storage
              mountPath: /var/lib/grafana-storage

      volumes:

        - name: datasource
          configMap:
            name: grafana-datasource

        - name: provider
          configMap:
            name: grafana-dashboard-provider

        - name: dashboard
          configMap:
            name: grafana-kubernetes-dashboard

        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: grafana

  ports:
    - name: http
      port: 3000
      targetPort: http
