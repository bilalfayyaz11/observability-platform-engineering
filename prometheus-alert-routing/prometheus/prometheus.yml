global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: alert-testing
    platform: linux

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100
