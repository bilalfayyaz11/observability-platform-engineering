global:
  resolve_timeout: 5m

route:
  receiver: "webhook-receiver"

  group_by:
    - alertname
    - instance

  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h

  routes:

    - matchers:
        - severity="critical"
      receiver: "critical-webhook"

    - matchers:
        - severity="warning"
      receiver: "warning-webhook"

receivers:

  - name: "webhook-receiver"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true

  - name: "critical-webhook"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true

  - name: "warning-webhook"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true

inhibit_rules:

  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - instance
