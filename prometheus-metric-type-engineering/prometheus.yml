global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "sample_application"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "127.0.0.1:8000"
