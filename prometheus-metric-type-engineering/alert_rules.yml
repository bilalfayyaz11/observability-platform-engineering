groups:
  - name: sample_application_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(demo_http_errors_total[2m]))
            /
            clamp_min(sum(rate(demo_http_requests_total[2m])), 0.001)
          ) > 0.10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High application error rate"
          description: "More than 10 percent of requests are returning errors."

      - alert: HighSimulatedCPUUsage
        expr: demo_cpu_usage_percent > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High simulated CPU usage"
          description: "Simulated CPU usage is {{ $value | printf \"%.2f\" }} percent."

      - alert: SlowApplicationRequests
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(demo_http_request_duration_seconds_bucket[2m])
            )
          ) > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow application requests"
          description: "The estimated 95th percentile latency is above 1.5 seconds."
