apiVersion: 1

providers:

  - name: Performance Observability
    orgId: 1
    folder: Performance Observability
    folderUid: performance-observability
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 10
    allowUiUpdates: false

    options:
      path: /var/lib/grafana/dashboards/performance
      foldersFromFilesStructure: false
