global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "sample-app-1"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "sample-app-1:8080"
        labels:
          environment: "production"
          region: "us-east-1"
          team: "backend"

  - job_name: "sample-app-2"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "sample-app-2:8080"
        labels:
          environment: "staging"
          region: "us-west-2"
          team: "frontend"

  - job_name: "sample-app-3"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "sample-app-3:8080"
        labels:
          environment: "development"
          region: "eu-west-1"
          team: "backend"
