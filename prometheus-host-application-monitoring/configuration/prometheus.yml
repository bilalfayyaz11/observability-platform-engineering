global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          environment: lab

  - job_name: node_exporter
    static_configs:
      - targets:
          - localhost:9100
        labels:
          job_type: system_metrics

  - job_name: sample_app
    static_configs:
      - targets:
          - localhost:8000
        labels:
          application: sample_metrics
          environment: lab
