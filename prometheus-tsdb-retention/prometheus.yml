global:
  scrape_interval: 5s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 2h
      size: 100MB

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - localhost:9100

  - job_name: custom_metrics
    scrape_interval: 2s
    static_configs:
      - targets:
          - localhost:8080

  - job_name: intensive_metrics
    scrape_interval: 1s
    static_configs:
      - targets:
          - localhost:8081
          - localhost:8082
          - localhost:8083
          - localhost:8084
          - localhost:8085
