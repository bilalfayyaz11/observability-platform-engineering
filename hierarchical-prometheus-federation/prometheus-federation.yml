global:
  scrape_interval: 30s
  evaluation_interval: 30s

  external_labels:
    monitor: global-federation

rule_files:
  - /etc/prometheus/federation/rules.yml

scrape_configs:
  - job_name: federate-cluster-a
    honor_labels: true
    metrics_path: /federate

    params:
      match[]:
        - '{__name__=~"up|node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_filesystem_avail_bytes|prometheus_tsdb_head_series|app_http_requests_total|app_request_duration_seconds_(bucket|sum|count)"}'

    static_configs:
      - targets:
          - localhost:9090

  - job_name: federate-cluster-b
    honor_labels: true
    metrics_path: /federate

    params:
      match[]:
        - '{__name__=~"up|node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_filesystem_avail_bytes|prometheus_tsdb_head_series|app_http_requests_total|app_request_duration_seconds_(bucket|sum|count)"}'

    static_configs:
      - targets:
          - localhost:9091
