global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    cluster: cluster-b
    region: us-west-2

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9091

  - job_name: node
    static_configs:
      - targets:
          - localhost:9101


  - job_name: app
    static_configs:
      - targets:
          - localhost:8081
