global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - rules/recording_rules.yml
  - rules/alerting_rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: bad-app
    static_configs:
      - targets:
          - 127.0.0.1:5000

  - job_name: good-app
    static_configs:
      - targets:
          - 127.0.0.1:5001
