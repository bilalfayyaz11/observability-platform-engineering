global:
  resolve_timeout: 5m

route:
  receiver: "local-observability"
  group_by:
    - alertname
    - instance
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

  routes:

    - matchers:
        - severity="critical"
      receiver: "critical-alerts"
      group_wait: 5s
      repeat_interval: 30m

    - matchers:
        - severity="warning"
      receiver: "warning-alerts"
      repeat_interval: 2h

receivers:

  - name: "local-observability"

  - name: "critical-alerts"

  - name: "warning-alerts"

inhibit_rules:

  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - instance
