filebeat.inputs:

- type: filestream
  id: application-logs

  enabled: true

  paths:
    - /var/log/syslog
    - /var/log/auth.log
    - /home/*/app.log

  fields:
    log_type: system
    environment: lab

  fields_under_root: true

output.logstash:
  hosts:
    - "127.0.0.1:5044"

logging.level: info

logging.to_files: true

logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
